[project]
name = "python_project_template"
version = "0.0.9"
description = "Copier template repository for generating uv-first Python projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["python", "template", "copier", "uv", "ruff"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

dependencies = []  # Runtime dependencies go here

[project.optional-dependencies]
dev = [
    "copier>=9.11.2",
    "jinja2-time>=0.2.0",
    "ruff>=0.8.0",
    "basedpyright>=1.21.0",
    "bandit>=1.8.0",
    "semgrep>=1.60.0",
    "radon>=6.0.0",
    "xenon>=0.9.0",
    "pre-commit>=4.0.0",
    "typing-extensions>=4.12.0",
    "detect-secrets>=1.5.0",
    "commitizen>=4.0.0",
    "validate-pyproject>=0.24",
    "deptry>=0.20",
]

test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.5.0",
    "pytest-cov>=6.0.0",
    "coverage[toml]>=7.6.0",
    "pytest-testmon>=2.2.0",
    "pytest-randomly>=3.15.0",
    "pytest-socket>=0.7.0",
]
[dependency-groups]
changelog = [
    "git-cliff>=2.6.0",
]
[project.urls]
Homepage = "https://github.com/buddingengineers12345/python_project_template"
Documentation = "https://github.com/buddingengineers12345/python_project_template#readme"
Repository = "https://github.com/buddingengineers12345/python_project_template"
Issues = "https://github.com/buddingengineers12345/python_project_template/issues"

# ==========================================================================
# Ruff Configuration
# ==========================================================================

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "RUF",   # ruff-specific rules
    "TC",    # flake8-type-checking
    "PGH",   # pygrep-hooks
    "PT",    # flake8-pytest-style
    "ARG",   # flake8-unused-arguments
    "D",     # pydocstyle — enforce Google-style docstrings
    "C90",   # McCabe complexity
    "PERF",  # perflint — catch performance anti-patterns
    "T20",   # flake8-print — discourage print() in non-test code
    "T10",   # flake8-debugger — no committed breakpoint()/pdb
    "N",     # pep8-naming — case conventions
    "A",     # flake8-builtins — no shadowed builtins
    "ERA",   # eradicate — no commented-out code
    "TD",    # flake8-todos — well-formed TODO/FIXME markers
    "DTZ",   # flake8-datetimez — no naive datetimes
    "ASYNC", # flake8-async — no blocking calls in async code
    "S",     # flake8-bandit — security patterns at edit time (standalone bandit stays for pre-commit/CI depth)
    "TRY",   # tryceratops — exception-handling hygiene
    "G",     # flake8-logging-format — no f-string/interpolated log messages
    "PTH",   # flake8-use-pathlib — pathlib over os.path
    "FBT",   # flake8-boolean-trap — no boolean positional flags
    "PL",    # pylint — complexity limits, magic values, eq/hash pairing
    "ANN",   # flake8-annotations — typed public functions
    "TID",   # flake8-tidy-imports — banned-api / relative-import policy
    "BLE",   # flake8-blind-except — no bare broad catches
]

# Each ignore is deliberate:
# E501 — line length is enforced by ruff format, not ruff check
# TRY003 — long exception messages are fine; guides don't mandate message brevity
# ANN401 — Any is allowed at integration boundaries; basedpyright owns deeper Any policy
# TD002/TD003 — TODO author/issue-link mandates are heavier than the house marker policy
# FBT003 — positional booleans in third-party calls are outside caller control
ignore = [
    "E501",
    "TRY003",
    "ANN401",
    "TD002",
    "TD003",
    "FBT003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# tests: print/unused-args OK (fixtures); assert is pytest's idiom (S101); magic values and
# untyped/boolean-flag helpers are fine in test code; subprocess-driven integration tests
# invoke git/uv/copier by name (S603/S607); local imports are idiomatic in tests (PLC0415).
# D stays enforced.
"tests/**"   = ["ARG", "T20", "S101", "PLR2004", "ANN", "FBT", "S603", "S607", "PLC0415", "S105", "S108"]
# automation scripts: print() is their UI; they exist to run git/uv subprocesses with
# repo-controlled arguments (S603/S607). Docstrings enforced (D).
"scripts/**" = ["T20", "S603", "S607"]
"template/scripts/**" = ["T20", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

# ==========================================================================
# BasedPyright Configuration
# ==========================================================================

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"

include = ["scripts", "tests"]
exclude = [
    "**/__pycache__",
    "**/.*",
    "build",
    "dist",
]

venvPath = "."
venv = ".venv"
# PEP 698 @override decorator check off: pythonVersion 3.11 (typing.override is 3.12+); override *compatibility* checks stay on in standard mode.
reportImplicitOverride = false
reportMissingImports = true
reportMissingTypeStubs = false
# Suppression hygiene (guides: typing/comments) — warnings first, upgrade to error once clean.
reportUnnecessaryTypeIgnoreComment = "warning"
reportIgnoreCommentWithoutRule = "warning"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

# ==========================================================================
# Pytest Configuration
# ==========================================================================

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "strict"  # pin pytest-asyncio default explicitly; async tests must be marked
testpaths = ["tests"]
pythonpath = ["."]  # "." exposes scripts/
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--log-level=WARNING",
    "-ra",
    "--testmon",
    "--disable-socket",
    "--allow-unix-socket",
]
markers = [
    "e2e: End-to-end tests across the full stack or external systems",
    "enable_socket: Integration tests that need network access (re-enables pytest-socket)",
    "integration: Tests crossing module boundaries, real I/O, subprocesses, or services",
    "regression: Guards a fixed bug or ticket-specific behaviour from returning",
    "slow: Routinely exceeds ~1s; excluded from default runs (override with -m slow)",
    "smoke: Minimal deploy or health checks on critical paths",
    "unit: Fast isolated tests with boundaries mocked or in-process only",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ==========================================================================
# Coverage Configuration
# ==========================================================================

[tool.coverage.run]
branch = true
source = ["scripts"]
omit = [
    "tests/*",
    "**/__init__.py",
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@overload",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"

# ==========================================================================
# Deptry Configuration (undeclared/unused dependency gate)
# ==========================================================================

[tool.deptry]
known_first_party = ["scripts", "tests"]

[tool.deptry.per_rule_ignores]
# DEP002: toolchain entries are CLI tools/plugins, invoked not imported.
DEP002 = [
    "copier",
    "pytest",
    "jinja2-time",
    "ruff",
    "basedpyright",
    "bandit",
    "semgrep",
    "radon",
    "xenon",
    "pre-commit",
    "typing-extensions",
    "detect-secrets",
    "commitizen",
    "validate-pyproject",
    "deptry",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-cov",
    "coverage",
    "pytest-testmon",
    "pytest-randomly",
    "git-cliff",
]

# Commitizen: conventional commits (`cz commit`), commit-msg validation via pre-commit.
# version_provider = "pep621" means commitizen reads/writes [project].version — no duplicate.
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"

# Bandit: security lint. Scans scripts/ (this repo's source layout).
[tool.bandit]
targets = ["scripts"]
skips = []
exclude_dirs = [".venv", "build", "dist", "tests"]
